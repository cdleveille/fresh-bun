<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="application-name" content="__title__" />
    <meta name="description" content="__description__" />
    <meta name="author" content="__author.name__" />
    <meta name="format-detection" content="telephone=no" />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="__theme.light__"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="__theme.dark__"
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="__title__" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="full-screen" content="yes" />
    <meta name="browsermode" content="application" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="__title__" />
    <meta property="og:description" content="__description__" />
    <meta property="og:site_name" content="__title__" />
    <meta property="og:url" content="__url__" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="__url__/icons/icon_512x512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="__title__" />
    <meta property="og:image:type" content="image/png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="__title__" />
    <meta name="twitter:description" content="__description__" />
    <meta name="twitter:image" content="__url__/icons/icon_512x512.png" />
    <meta name="robots" content="index, follow" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="canonical" href="__url__" />
    <link rel="icon" href="icons/bun.svg" type="image/svg+xml" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link
      rel="apple-touch-icon"
      href="icons/icon_180x180.png"
      sizes="180x180"
    />
    <script>
      (() => {
        var stored;
        try {
          stored = JSON.parse(localStorage.getItem("theme")).state.theme;
        } catch {
          stored = null;
        }
        var theme =
          stored === "light" || stored === "dark"
            ? stored
            : window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <link rel="stylesheet" href="style.css" />
    <link rel="manifest" href="manifest.json" />
    <script src="main.tsx" type="module"></script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "__title__",
        "description": "__description__",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Any",
        "author": {
          "@type": "Person",
          "name": "__author.name__",
          "url": "__author.url__"
        }
      }
    </script>
    <title>__title__</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>This app requires JavaScript to be enabled.</noscript>
  </body>
</html>
